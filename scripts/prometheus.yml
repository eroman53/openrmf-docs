global:
  scrape_interval:     30s # By default, scrape targets every 5 seconds.

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  # external_labels:
  #   monitor: 'nats-openrmf-server'

# A scrape configuration containing exactly one endpoint to scrape:
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'nats-openrmf-server'
    static_configs:
      - targets: ['natspromexporter:7777']
  - job_name: 'nats-openrmf-client-metrics'
    static_configs:
      - targets: ['nats-client-metrics:7778']
  - job_name: 'openrmf-api-read-prometheus'
    # metrics_path defaults to '/metrics'
    static_configs:
    - targets: ['openrmfapi-read:8084']
  - job_name: 'openrmf-api-template-prometheus'
    # metrics_path defaults to '/metrics'
    static_configs:
    # replace the IP with your local IP for development
    # localhost is not it, as that is w/in the container :)
    - targets: ['openrmfapi-template:8088']
  - job_name: 'openrmf-api-controls-prometheus'
    # metrics_path defaults to '/metrics'
    static_configs:
    # replace the IP with your local IP for development
    # localhost is not it, as that is w/in the container :)
    - targets: ['openrmfapi-controls:8094']
  - job_name: 'openrmf-api-scoring-prometheus'
    # metrics_path defaults to '/metrics'
    static_configs:
    # replace the IP with your local IP for development
    # localhost is not it, as that is w/in the container :)
    - targets: ['openrmfapi-scoring:8090']
  - job_name: 'openrmf-api-audit-prometheus'
    # metrics_path defaults to '/metrics'
    static_configs:
    # replace the IP with your local IP for development
    # localhost is not it, as that is w/in the container :)
    - targets: ['openrmfapi-audit:8096']
  - job_name: 'openrmf-api-report-prometheus'
    # metrics_path defaults to '/metrics'
    static_configs:
    # replace the IP with your local IP for development
    # localhost is not it, as that is w/in the container :)
    - targets: ['openrmfapi-report:8098']
  - job_name: 'openrmf-api-scanhistory-prometheus'
    static_configs:
    - targets: ['openrmfapi-scanhistory:8100']
  - job_name: 'openrmf-api-poam-prometheus'
    static_configs:
    - targets: ['openrmfapi-poam:8102']
  - job_name: 'openrmf-api-journal-prometheus'
    static_configs:
    - targets: ['openrmfapi-journal:8104']
  - job_name: 'openrmf-api-scanwatch-prometheus'
    static_configs:
    - targets: ['openrmfsvc-scanwatch:8106']
  - job_name: 'openrmf-api-conmon-prometheus'
    static_configs:
    - targets: ['openrmfapi-conmon:8108']
  - job_name: 'openrmf-api-inventory-prometheus'
    static_configs:
    - targets: ['openrmfapi-inventory:8110']
  - job_name: 'openrmf-api-tasks-prometheus'
    static_configs:
    - targets: ['openrmfapi-tasks:8112']
  - job_name: 'openrmf-api-trivyscan-prometheus'
    static_configs:
    - targets: ['openrmfsvc-trivy:8114']
  - job_name: 'openrmf-api-notify-prometheus'
    static_configs:
    - targets: ['openrmfsvc-notify:8116']
  - job_name: 'openrmf-api-ppsm-prometheus'
    static_configs:
    - targets: ['openrmfapi-ppsm:8118']
  - job_name: 'openrmf-api-oscal-prometheus'
    static_configs:
    - targets: ['openrmfapi-oscal:8120']
  - job_name: 'openrmf-web'
    scrape_interval: 1m
    metrics_path: '/metrics'
    static_configs:
      - targets: ['nginx-metrics:9113']
