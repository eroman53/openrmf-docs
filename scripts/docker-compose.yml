### put all the volume listings here for persistent data
volumes:
  mongo-data-volume:
  trivyscan-cache-volume:
  trivyscan-target-volume:
  # NFS-backed scan target: the Docker host kernel mounts the export (no
  # privileged container needed). Set TRIVYSCAN_TARGET=trivyscan-nfs plus
  # TRIVYSCAN_NFS_SERVER (host/IP) and TRIVYSCAN_NFS_PATH (export path) in
  # .env. The volume only mounts when the scanner container references it.
  trivyscan-nfs:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${TRIVYSCAN_NFS_SERVER:-nfs-server.example.mil},ro,soft,nolock,vers=${TRIVYSCAN_NFS_VERS:-4}"
      device: ":${TRIVYSCAN_NFS_PATH:-/exports/scans}"
  openrmf-prometheus-data-volume:
  openrmf-grafana-data-volume:
  keycloak-postgres16:

### put all the networks here
networks:
  openrmf: