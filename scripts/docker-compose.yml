      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - auditdb
      - natsserver
    networks:
      - openrmf

  openrmfmsg-reports:
    image: docker.io/cingulara/openrmf-msg-reports:1.14.01
    container_name: openrmf-report-nats-message-client
    restart: on-failure:5
    environment:
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@checklistdb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - SYSTEMDBTYPE=mongo
      - REPORTDBCONNECTION=mongodb://openrmfreport:openrmf1234!@reportdb/openrmfreport?authSource=openrmfreport
      - REPORTDB=openrmfreport
      - REPORTDBTYPE=mongo
      - SCANHISTORYDBCONNECTION=mongodb://openrmfscanhistory:openrmf1234!@scanhistorydb/openrmfscanhistory?authSource=openrmfscanhistory
      - SCANHISTORYDB=openrmfscanhistory
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - checklistdb
      - reportdb
      - scanhistorydb
      - natsserver
    networks:
      - openrmf

  openrmfmsg-poam:
    image: eroman53/openrmf-msg-poam:latest
    container_name: openrmf-poam-nats-message-client
    restart: on-failure:5
    environment:
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@checklistdb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - POAMDBCONNECTION=mongodb://openrmfpoam:openrmf1234!@poamdb/openrmfpoam?authSource=openrmfpoam
      - POAMDB=openrmfpoam
      - SCANHISTORYDBCONNECTION=mongodb://openrmfscanhistory:openrmf1234!@scanhistorydb/openrmfscanhistory?authSource=openrmfscanhistory
      - SCANHISTORYDB=openrmfscanhistory
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - checklistdb
      - poamdb
      - scanhistorydb
      - natsserver
    networks:
      - openrmf

  openrmfsvc-scanwatch:
    image: eroman53/openrmf-svc-scanwatch:latest
    container_name: openrmf-scanwatch
    restart: on-failure:5
    environment:
      - WATCHROOT=/scans
      - POLLSECONDS=${SCANWATCH_POLLSECONDS:-300}
      - STABLESECONDS=${SCANWATCH_STABLESECONDS:-60}
      - AUTOCREATESYSTEMS=${SCANWATCH_AUTOCREATE:-false}
      - OPENRMFAPIURL=http://openrmfapi-read:8084
      - KEYCLOAKTOKENURL=http://openrmf-keycloak:8080/auth/realms/openrmf/protocol/openid-connect/token
      - CLIENTID=openrmf-scanwatch
      - CLIENTSECRET=${SCANWATCH_CLIENTSECRET}
      - DBCONNECTION=mongodb://openrmfscanwatch:openrmf1234!@scanwatchdb/openrmfscanwatch?authSource=openrmfscanwatch
      - DB=openrmfscanwatch
      - LOGLEVEL=2
    volumes:
      # back this with the CIFS-mounted scc-scans volume below (SMB share), or
      # point SCANWATCH_SOURCE at a host path for local testing
      - ${SCANWATCH_SOURCE:-scc-scans}:/scans:ro
    depends_on:
      - scanwatchdb
      - openrmfapi-read
    networks:
      - openrmf

  openrmfmsg-journal:
    image: eroman53/openrmf-msg-journal:latest
    container_name: openrmf-journal-nats-message-client
    restart: on-failure:5
    environment:
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@checklistdb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - JOURNALDBCONNECTION=mongodb://openrmfjournal:openrmf1234!@journaldb/openrmfjournal?authSource=openrmfjournal
      - JOURNALDB=openrmfjournal
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - checklistdb
      - journaldb
      - natsserver
    networks:
      - openrmf

### 5 MongoDB Containers
  checklistdb:
    image: docker.io/cingulara/mongo:7.0.32-jammy-nonroot
    container_name: mongodb-checklist
    restart: on-failure:5
    ports:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=myp2ssw0rd
      - MONGO_INITDB_DATABASE=openrmf
    volumes:
      - checklist-data-volume:/data/db
      - ./initializeChecklist.js:/docker-entrypoint-initdb.d/initialize.js:Z
    networks:
      - openrmf

  scoredb:
    image: docker.io/cingulara/mongo:7.0.32-jammy-nonroot
    container_name: mongodb-score
    restart: on-failure:5
    ports:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=myp2ssw0rd
      - MONGO_INITDB_DATABASE=openrmfscore
    volumes:
      - score-data-volume:/data/db
      - ./initializeScore.js:/docker-entrypoint-initdb.d/initialize.js:Z
    networks:
      - openrmf

  templatedb:
    image: docker.io/cingulara/mongo:7.0.32-jammy-nonroot
    container_name: mongodb-template
    restart: on-failure:5
    ports:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=myp2ssw0rd
      - MONGO_INITDB_DATABASE=openrmftemplate
    volumes:
