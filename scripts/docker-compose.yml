version : '3.8'
 
services:
### 1 Web Front End Container
  openrmf-web:
    image: eroman53/openrmf-web:latest
    # image: cingulara/openrmf-web:1.14.01-privileged # this is to eventually make HTTPS 443 in a non-privileged manner
    container_name: openrmf-web
    restart: on-failure:5
    ports:
      - 8080:8080
      # - 8443:8443
    depends_on:
      - openrmfapi-scoring
      - openrmfapi-template
      - openrmfapi-read
      - openrmfapi-controls
      - openrmfapi-audit
      - openrmfapi-report
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:Z
      # - ./ssl/:/etc/ssl/:Z
    networks:
      - openrmf

### 6 API Containers
  openrmfapi-scoring:
    image: docker.io/cingulara/openrmf-api-scoring:1.14.02
    container_name: openrmf-scoring-api
    restart: on-failure:5
    ports:
      - "8090"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8090
      - DBCONNECTION=mongodb://openrmfscore:REDACTED@mongodb/openrmfscore?authSource=openrmfscore
      - DBTYPE=mongo
      - DB=openrmfscore
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf
  
  openrmfapi-template:
    image: docker.io/cingulara/openrmf-api-template:1.14.04
    container_name: openrmf-template-api
    restart: on-failure:5
    ports:
      - "8088"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8088
      - NATSSERVERURL=nats://natsserver:4222
      - DBCONNECTION=mongodb://openrmftemplate:REDACTED@mongodb/openrmftemplate?authSource=openrmftemplate
      - DB=openrmftemplate
      - DBTYPE=mongo
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-read:
    image: eroman53/openrmf-api-read:latest
    container_name: openrmf-read-api
    restart: on-failure:5
    ports:
      - "8084"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8084
      - NATSSERVERURL=nats://natsserver:4222
      - DBCONNECTION=mongodb://openrmf:REDACTED@mongodb/openrmf?authSource=openrmf
      - DB=openrmf
      - DBTYPE=mongo
      - SCANHISTORYAPIURL=http://openrmfapi-scanhistory:8100
      # report DB (read-only): vulnerability full-text search
      - REPORTDBCONNECTION=mongodb://openrmfreport:REDACTED@mongodb/openrmfreport?authSource=openrmfreport
      - REPORTDB=openrmfreport
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - openrmfapi-scanhistory
    networks:
      - openrmf

  openrmfapi-scanhistory:
    image: eroman53/openrmf-api-scanhistory:latest
    container_name: openrmf-scanhistory-api
    restart: on-failure:5
    ports:
      - "8100"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8100
      - DBCONNECTION=mongodb://openrmfscanhistory:REDACTED@mongodb/openrmfscanhistory?authSource=openrmfscanhistory
      - DB=openrmfscanhistory
      - DBTYPE=mongo
      - SYSTEMDBCONNECTION=mongodb://openrmf:REDACTED@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-poam:
    image: eroman53/openrmf-api-poam:latest
    container_name: openrmf-poam-api
    restart: on-failure:5
    ports:
      - "8102"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8102
      - NATSSERVERURL=nats://natsserver:4222
      - DBCONNECTION=mongodb://openrmfpoam:REDACTED@mongodb/openrmfpoam?authSource=openrmfpoam
      - DB=openrmfpoam
      - DBTYPE=mongo
      - SYSTEMDBCONNECTION=mongodb://openrmf:REDACTED@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

  openrmfapi-journal:
    image: eroman53/openrmf-api-journal:latest
    container_name: openrmf-journal-api
    restart: on-failure:5
    ports:
      - "8104"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8104
      - DBCONNECTION=mongodb://openrmfjournal:REDACTED@mongodb/openrmfjournal?authSource=openrmfjournal
      - DB=openrmfjournal
      - DBTYPE=mongo
      - SYSTEMDBCONNECTION=mongodb://openrmf:REDACTED@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-controls:
    image: docker.io/cingulara/openrmf-api-controls:1.14.02
    container_name: openrmf-controls-api
    restart: on-failure:5
    ports:
      - "8094"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8094
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    networks:
      - openrmf

  openrmfapi-audit:
    image: docker.io/cingulara/openrmf-api-audit:1.14.02
    container_name: openrmf-audit-api
    restart: on-failure:5
    ports:
      - "8096"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8096
      - DBCONNECTION=mongodb://openrmfaudit:REDACTED@mongodb/openrmfaudit?authSource=openrmfaudit
      - DB=openrmfaudit
      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-report:
    image: docker.io/cingulara/openrmf-api-report:1.14.02
    container_name: openrmf-report-api
    restart: on-failure:5
    ports:
      - "8098"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8098
      - DBCONNECTION=mongodb://openrmfreport:REDACTED@mongodb/openrmfreport?authSource=openrmfreport
      - DB=openrmfreport
      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

### 7 Messaging Containers
  openrmfmsg-score:
    image: docker.io/cingulara/openrmf-msg-score:1.14.01
    container_name: openrmf-score-nats-message-client
    restart: on-failure:5
    environment:
      - DBCONNECTION=mongodb://openrmfscore:REDACTED@mongodb/openrmfscore?authSource=openrmfscore
      - DBTYPE=mongo
      - DB=openrmfscore
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

  openrmfmsg-compliance:
    image: docker.io/cingulara/openrmf-msg-compliance:1.14.01
    container_name: openrmf-compliance-nats-message-client
    restart: on-failure:5
    environment:
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - natsserver
    networks:
      - openrmf

  openrmfmsg-controls:
    image: docker.io/cingulara/openrmf-msg-controls:1.14.01
    container_name: openrmf-controls-nats-message-client
    restart: on-failure:5
    environment:
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - natsserver
    networks:
      - openrmf

  openrmfmsg-template:
    image: docker.io/cingulara/openrmf-msg-template:1.14.01
    container_name: openrmf-template-nats-message-client
    restart: on-failure:5
    environment:
      - DBCONNECTION=mongodb://openrmftemplate:REDACTED@mongodb/openrmftemplate?authSource=openrmftemplate
      - DB=openrmftemplate
      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

  openrmfmsg-system:
    image: docker.io/cingulara/openrmf-msg-system:1.14.01
    container_name: openrmf-system-nats-message-client
    restart: on-failure:5
    environment:
      - DBCONNECTION=mongodb://openrmf:REDACTED@mongodb/openrmf?authSource=openrmf
      - DB=openrmf
      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

  # One host for the inventory, journal, POA&M and report listeners. They were
  # four containers subscribing to an overlapping set of subjects, so a single
  # checklist save was delivered four times and the same artifact was read out
  # of Mongo four times. See openrmf-msg-hub/README.md.
  #
  # Every variable below is carried over verbatim from the four services this
  # replaces: each module still connects to its own database with its own
  # credentials.
  openrmfmsg-hub:
    image: eroman53/openrmf-msg-hub:latest
    container_name: openrmf-message-hub
    restart: on-failure:5
    environment:
      # shared: the checklist/system database every module reads
      - SYSTEMDBCONNECTION=mongodb://openrmf:REDACTED@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - SYSTEMDBTYPE=mongo
      # inventory module
      - INVENTORYDBCONNECTION=mongodb://openrmfinventory:REDACTED@mongodb/openrmfinventory?authSource=openrmfinventory
      - INVENTORYDB=openrmfinventory
      # journal module
      - JOURNALDBCONNECTION=mongodb://openrmfjournal:REDACTED@mongodb/openrmfjournal?authSource=openrmfjournal
      - JOURNALDB=openrmfjournal
      # POA&M module
      - POAMDBCONNECTION=mongodb://openrmfpoam:REDACTED@mongodb/openrmfpoam?authSource=openrmfpoam
      - POAMDB=openrmfpoam
      # reports module
      - REPORTDBCONNECTION=mongodb://openrmfreport:REDACTED@mongodb/openrmfreport?authSource=openrmfreport
      - REPORTDB=openrmfreport
      - REPORTDBTYPE=mongo
      # shared by inventory, POA&M and reports
      - SCANHISTORYDBCONNECTION=mongodb://openrmfscanhistory:REDACTED@mongodb/openrmfscanhistory?authSource=openrmfscanhistory
      - SCANHISTORYDB=openrmfscanhistory
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
      # LOGLEVEL=2 (Info) additionally logs, per message, how many artifact reads
      # the modules shared -- the measure of what merging them actually bought.
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

  openrmfmsg-audit:
    image: docker.io/cingulara/openrmf-msg-audit:1.14.01
    container_name: openrmf-audit-nats-message-client
    restart: on-failure:5
    environment:
      - DBCONNECTION=mongodb://openrmfaudit:REDACTED@mongodb/openrmfaudit?authSource=openrmfaudit
      - DB=openrmfaudit
      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

  openrmfsvc-trivy:
    image: eroman53/openrmf-svc-trivy:latest
    container_name: openrmf-trivy-scanner
    restart: on-failure:5
    ports:
      - "8114"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8114
      - DBCONNECTION=mongodb://openrmftrivyscan:REDACTED@mongodb/openrmftrivyscan?authSource=openrmftrivyscan
      - DB=openrmftrivyscan
      # read-only view of the checklist DB so the API can enforce package-level RBAC
      - SYSTEMDBCONNECTION=mongodb://openrmf:REDACTED@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - SCANHISTORYAPIURL=http://openrmfapi-scanhistory:8100
      - KEYCLOAKTOKENURL=http://openrmf-keycloak:8080/auth/realms/openrmf/protocol/openid-connect/token
      - CLIENTID=openrmf-scanwatch
      - CLIENTSECRET=${SCANWATCH_CLIENTSECRET}
      - LOGLEVEL=2
    volumes:
      # the folder tree Trivy scans. TRIVYSCAN_TARGET picks the source:
      #   - a host path for local content, or
      #   - "trivyscan-nfs" to use the NFS export defined below
      #     (set TRIVYSCAN_NFS_SERVER + TRIVYSCAN_NFS_PATH in .env)
      # the UI's folder picker traverses whatever is mounted here
      - ${TRIVYSCAN_TARGET:-trivyscan-target-volume}:/target:ro
      # persists the ~60MB Trivy vulnerability DB across container recreation
      - trivyscan-cache-volume:/app/.trivycache
    depends_on:
      - mongodb
      - openrmfapi-scanhistory
    networks:
      - openrmf

  openrmfsvc-notify:
    image: eroman53/openrmf-svc-notify:latest
    container_name: openrmf-notify
    restart: on-failure:5
    ports:
      - "8116"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8116
      - DBCONNECTION=mongodb://openrmfnotify:REDACTED@mongodb/openrmfnotify?authSource=openrmfnotify
      - DB=openrmfnotify
      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      # checklist DB: resolve artifact->system + read package RBAC grants
      - SYSTEMDBCONNECTION=mongodb://openrmf:REDACTED@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      # ConMon posture for the weekly digest (service-account call bypasses RBAC)
      - CONMONAPIURL=http://openrmfapi-conmon:8108
      - KEYCLOAKTOKENURL=http://openrmf-keycloak:8080/auth/realms/openrmf/protocol/openid-connect/token
      - CLIENTID=openrmf-scanwatch
      - CLIENTSECRET=${SCANWATCH_CLIENTSECRET}
      - LOGLEVEL=2
    depends_on:
      - mongodb
      - natsserver
      - openrmfapi-conmon
    networks:
      - openrmf

  openrmfapi-tasks:
    image: eroman53/openrmf-api-tasks:latest
    container_name: openrmf-tasks-api
    restart: on-failure:5
    ports:
      - "8112"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8112
      - DBCONNECTION=mongodb://openrmftasks:REDACTED@mongodb/openrmftasks?authSource=openrmftasks
      - DB=openrmftasks
      - DBTYPE=mongo
      - SYSTEMDBCONNECTION=mongodb://openrmf:REDACTED@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-oscal:
    image: eroman53/openrmf-api-oscal:latest
    container_name: openrmf-oscal-api
    restart: on-failure:5
    ports:
      - "8120"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8120
      - DBCONNECTION=mongodb://openrmfoscal:REDACTED@mongodb/openrmfoscal?authSource=openrmfoscal
      - DB=openrmfoscal
      - DBTYPE=mongo
      # read-only view of the checklist DB: the per-system profile endpoints are
      # package-scoped and enforce the usual package RBAC grants
      - SYSTEMDBCONNECTION=mongodb://openrmf:REDACTED@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-ppsm:
    image: eroman53/openrmf-api-ppsm:latest
    container_name: openrmf-ppsm-api
    restart: on-failure:5
    ports:
      - "8118"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8118
      - DBCONNECTION=mongodb://openrmfppsm:REDACTED@mongodb/openrmfppsm?authSource=openrmfppsm
      - DB=openrmfppsm
      - DBTYPE=mongo
      # read-only cross-service view of scan-observed open ports for reconciliation
      - SYSTEMDBCONNECTION=mongodb://openrmf:REDACTED@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - SCANHISTORYDBCONNECTION=mongodb://openrmfscanhistory:REDACTED@mongodb/openrmfscanhistory?authSource=openrmfscanhistory
      - SCANHISTORYDB=openrmfscanhistory
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-inventory:
    image: eroman53/openrmf-api-inventory:latest
    container_name: openrmf-inventory-api
    restart: on-failure:5
    ports:
      - "8110"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8110
      - DBCONNECTION=mongodb://openrmfinventory:REDACTED@mongodb/openrmfinventory?authSource=openrmfinventory
      - DB=openrmfinventory
      - DBTYPE=mongo
      # read-only cross-service views for reconciliation and fleet findings
      - SYSTEMDBCONNECTION=mongodb://openrmf:REDACTED@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - SCANHISTORYDBCONNECTION=mongodb://openrmfscanhistory:REDACTED@mongodb/openrmfscanhistory?authSource=openrmfscanhistory
      - SCANHISTORYDB=openrmfscanhistory
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-conmon:
    image: eroman53/openrmf-api-conmon:latest
    container_name: openrmf-conmon-api
    restart: on-failure:5
    ports:
      - "8108"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8108
      - DBCONNECTION=mongodb://openrmfconmon:REDACTED@mongodb/openrmfconmon?authSource=openrmfconmon
      - DB=openrmfconmon
      - DBTYPE=mongo
      # read-only cross-service views for posture computation
      - SYSTEMDBCONNECTION=mongodb://openrmf:REDACTED@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - SCANHISTORYDBCONNECTION=mongodb://openrmfscanhistory:REDACTED@mongodb/openrmfscanhistory?authSource=openrmfscanhistory
      - SCANHISTORYDB=openrmfscanhistory
      - POAMDBCONNECTION=mongodb://openrmfpoam:REDACTED@mongodb/openrmfpoam?authSource=openrmfpoam
      - POAMDB=openrmfpoam
      - TEMPLATEDBCONNECTION=mongodb://openrmftemplate:REDACTED@mongodb/openrmftemplate?authSource=openrmftemplate
      - TEMPLATEDB=openrmftemplate
      # asset registry: canonical host identity for coverage reconciliation
      # (optional -- coverage degrades to raw hostname matching if unset)
      - INVENTORYDBCONNECTION=mongodb://openrmfinventory:REDACTED@mongodb/openrmfinventory?authSource=openrmfinventory
      - INVENTORYDB=openrmfinventory
      # 800-53 control assessment: which controls are overdue, unscheduled or
      # never assessed (optional -- posture reports "not configured" if unset)
      - OSCALDBCONNECTION=mongodb://openrmfoscal:REDACTED@mongodb/openrmfoscal?authSource=openrmfoscal
      - OSCALDB=openrmfoscal
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfsvc-scanwatch:
    image: eroman53/openrmf-svc-scanwatch:latest
    container_name: openrmf-scanwatch
    restart: on-failure:5
    ports:
      - "8106"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8106
      # the SMB share location and read-only credentials are configured in the
      # web UI (Admin > Scan Watch), stored in this service's own DB -- not here
      - OPENRMFAPIURL=http://openrmfapi-read:8084
      - KEYCLOAKTOKENURL=http://openrmf-keycloak:8080/auth/realms/openrmf/protocol/openid-connect/token
      - CLIENTID=openrmf-scanwatch
      - CLIENTSECRET=${SCANWATCH_CLIENTSECRET}
      - DBCONNECTION=mongodb://openrmfscanwatch:REDACTED@mongodb/openrmfscanwatch?authSource=openrmfscanwatch
      - DB=openrmfscanwatch
      - LOGLEVEL=2
    depends_on:
      - mongodb
      - openrmfapi-read
    networks:
      - openrmf

  mongodb:
    image: docker.io/cingulara/mongo:7.0.32-jammy-nonroot
    container_name: mongodb
    restart: on-failure:5
    ports:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=REDACTED
      - MONGO_INITDB_DATABASE=openrmf
    volumes:
      - mongo-data-volume:/data/db
      - ./initializeAll.js:/docker-entrypoint-initdb.d/initialize.js:Z
    networks:
      - openrmf
### NATS messaging container (internal)
  natsserver: 
    image: docker.io/nats:2.12.8-alpine3.22
    container_name: nats
    command: -m 8222
    restart: on-failure:5
    ports:
      - "4222"
      - "6222"
      - "8222"
    networks:
      - openrmf

### Metrics
  natspromexporter: 
    # Observability. Not needed for functional work, so it is opt-in:
    #   docker compose --profile metrics up -d
    profiles:
      - metrics
    image: docker.io/natsio/prometheus-nats-exporter:0.19.2
    container_name: nats-prometheus-exporter
    command: -varz -connz -subz http://natsserver:8222
    restart: on-failure:5
    ports:
      - "7777"
    networks:
      - openrmf

  nats-client-metrics: 
    # Observability. Not needed for functional work, so it is opt-in:
    #   docker compose --profile metrics up -d
    profiles:
      - metrics
    image: docker.io/cingulara/nats-client-metrics:2.1.3
    container_name: nats-client-metrics
    restart: on-failure:5
    ports:
      - "7778"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:7778
      - NATSMETRICSURL=http://natsserver:8222
    networks:
      - openrmf

  nginx-metrics: 
    # Observability. Not needed for functional work, so it is opt-in:
    #   docker compose --profile metrics up -d
    profiles:
      - metrics
    image: docker.io/nginx/nginx-prometheus-exporter:1.5.1
    container_name: nginx-metrics
    restart: on-failure:1000
    command:
      - -nginx.scrape-uri
      - http://openrmf-web:8080/status
      # - https://openrmf-web:8443/status
    ports:
      - "9113"
    # environment:
    #   - SSL_VERIFY=false # do not verify on any SSL self signed cert for the web UI
    networks:
      - openrmf

  prometheus:
    # Observability. Not needed for functional work, so it is opt-in:
    #   docker compose --profile metrics up -d
    profiles:
      - metrics
    image: docker.io/prom/prometheus:v3.10.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    restart: on-failure:5
    ports:
      - "9090"
    volumes:
      - openrmf-prometheus-data-volume:/prometheus # persist the data
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:Z
    networks:
      - openrmf

  grafana: 
    # Observability. Not needed for functional work, so it is opt-in:
    #   docker compose --profile metrics up -d
    profiles:
      - metrics
    image: docker.io/grafana/grafana:11.6.13-ubuntu
    container_name: grafana
    env_file: .grafana
    restart: on-failure:5
    ports:
      - "3000"
    volumes:
      - openrmf-grafana-data-volume:/var/lib/grafana # persist the data
      - ./grafana/dashboards/:/etc/grafana/provisioning/dashboards/:Z
      - ./grafana/datasources/:/etc/grafana/provisioning/datasources/:Z
    networks:
      - openrmf

  postgres16:
    image: docker.io/postgres:16.13-alpine3.23
    container_name: openrmf-postgres16
    restart: on-failure:5
    ports:
      - "5432"
    environment:
      - POSTGRES_DB=openrmf-keycloak 
      - POSTGRES_USER=openrmf-keycloak 
      - POSTGRES_PASSWORD=REDACTED
    networks:
      - openrmf
    volumes:
      - keycloak-postgres16:/var/lib/postgresql/data

  keycloak: 
    container_name: openrmf-keycloak
    # fork image: upstream keycloak-openrmf plus the STOOGE theme
    #   docker build -t eroman53/keycloak-stooge:26.7.2 ../keycloak-image
    image: eroman53/keycloak-stooge:26.7.2
    restart: on-failure:10
    command:
      - start
      - --spi-theme-welcome-theme=stooge
    ports:
      - "8080"
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://openrmf-postgres16:5432/openrmf-keycloak
      - KC_DB_USERNAME=openrmf-keycloak
      - KC_DB_PASSWORD=REDACTED
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=REDACTED
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_HTTP_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      # - KC_LOG_LEVEL=DEBUG
    depends_on:
      - postgres16
    networks:
      - openrmf

### put all the volume listings here for persistent data
volumes:
  mongo-data-volume:
  trivyscan-cache-volume:
  trivyscan-target-volume:
  # NFS-backed scan target: the Docker host kernel mounts the export (no
  # privileged container needed). Set TRIVYSCAN_TARGET=trivyscan-nfs plus
  # TRIVYSCAN_NFS_SERVER (host/IP) and TRIVYSCAN_NFS_PATH (export path) in
  # .env. The volume only mounts when the scanner container references it.
  trivyscan-nfs:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${TRIVYSCAN_NFS_SERVER:-nfs-server.example.mil},ro,soft,nolock,vers=${TRIVYSCAN_NFS_VERS:-4}"
      device: ":${TRIVYSCAN_NFS_PATH:-/exports/scans}"
  openrmf-prometheus-data-volume:
  openrmf-grafana-data-volume:
  keycloak-postgres16:

### put all the networks here
networks:
  openrmf: