      - ./initializeJournal.js:/docker-entrypoint-initdb.d/initialize.js:Z
    networks:
      - openrmf

### NATS messaging container (internal)
  natsserver: 
    image: docker.io/nats:2.12.8-alpine3.22
    container_name: nats
    command: -m 8222
    restart: on-failure:5
    ports:
      - "4222"
      - "6222"
      - "8222"
    networks:
      - openrmf

### Metrics
  natspromexporter: 
    image: docker.io/natsio/prometheus-nats-exporter:0.19.2
    container_name: nats-prometheus-exporter
    command: -varz -connz -subz http://natsserver:8222
    restart: on-failure:5
    ports:
      - "7777"
    networks:
      - openrmf

  nats-client-metrics: 
    image: docker.io/cingulara/nats-client-metrics:2.1.3
    container_name: nats-client-metrics
    restart: on-failure:5
    ports:
      - "7778"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:7778
      - NATSMETRICSURL=http://natsserver:8222
    networks:
      - openrmf

  nginx-metrics: 
    image: docker.io/nginx/nginx-prometheus-exporter:1.5.1
    container_name: nginx-metrics
    restart: on-failure:1000
    command:
      - -nginx.scrape-uri
      - http://openrmf-web:8080/status
      # - https://openrmf-web:8443/status
    ports:
      - "9113"
    # environment:
    #   - SSL_VERIFY=false # do not verify on any SSL self signed cert for the web UI
    networks:
      - openrmf

  prometheus:
    image: docker.io/prom/prometheus:v3.10.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    restart: on-failure:5
    ports:
      - "9090"
    volumes:
      - openrmf-prometheus-data-volume:/prometheus # persist the data
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:Z
    networks:
      - openrmf

  grafana: 
    image: docker.io/grafana/grafana:11.6.13-ubuntu
    container_name: grafana
    env_file: .grafana
    restart: on-failure:5
    ports:
      - "3000"
    volumes:
      - openrmf-grafana-data-volume:/var/lib/grafana # persist the data
      - ./grafana/dashboards/:/etc/grafana/provisioning/dashboards/:Z
      - ./grafana/datasources/:/etc/grafana/provisioning/datasources/:Z
    networks:
      - openrmf

  postgres16:
    image: docker.io/postgres:16.13-alpine3.23
    container_name: openrmf-postgres16
    restart: on-failure:5
    ports:
      - "5432"
    environment:
      - POSTGRES_DB=openrmf-keycloak 
      - POSTGRES_USER=openrmf-keycloak 
      - POSTGRES_PASSWORD=p2sst1rn0g
    networks:
      - openrmf
    volumes:
      - keycloak-postgres16:/var/lib/postgresql/data

  keycloak: 
    container_name: openrmf-keycloak
    image: docker.io/cingulara/keycloak-openrmf:26.5.7
    restart: on-failure:10
    command:
      - start
      - --spi-theme-welcome-theme=openrmf
    ports:
      - "8080"
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://openrmf-postgres16:5432/openrmf-keycloak
      - KC_DB_USERNAME=openrmf-keycloak
      - KC_DB_PASSWORD=p2sst1rn0g
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_HTTP_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      # - KC_LOG_LEVEL=DEBUG
    depends_on:
      - postgres16
    networks:
      - openrmf

### put all the volume listings here for persistent data
volumes:
  template-data-volume:
  checklist-data-volume:
  score-data-volume:
  audit-data-volume:
  report-data-volume:
  scanhistory-data-volume:
  poam-data-volume:
  journal-data-volume:
  scanwatch-data-volume:
  # the SCC scan drop share (SMB). Set SCANWATCH_SHARE/_USER/_PASS in .env;
  # for local testing set SCANWATCH_SOURCE to a host directory instead and
  # this volume is never mounted.
  scc-scans:
    driver: local
    driver_opts:
      type: cifs
      device: ${SCANWATCH_SHARE:-//fileserver/scc-drops}
      o: "username=${SCANWATCH_SHARE_USER:-changeme},password=${SCANWATCH_SHARE_PASS:-changeme},ro,vers=3.0"
  openrmf-prometheus-data-volume:
  openrmf-grafana-data-volume:
  keycloak-postgres16:

### put all the networks here
networks:
  openrmf: