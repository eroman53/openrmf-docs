version : '3.8'
 
services:
### 1 Web Front End Container
  openrmf-web:
    image: docker.io/cingulara/openrmf-web:1.14.01
    # image: cingulara/openrmf-web:1.14.01-privileged # this is to eventually make HTTPS 443 in a non-privileged manner
    container_name: openrmf-web
    restart: on-failure:5
    ports:
      - 8080:8080
      # - 8443:8443
    depends_on:
      - openrmfapi-scoring
      - openrmfapi-template
      - openrmfapi-read
      - openrmfapi-controls
      - openrmfapi-audit
      - openrmfapi-report
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:Z
      # - ./ssl/:/etc/ssl/:Z
    networks:
      - openrmf

### 6 API Containers
  openrmfapi-scoring:
    image: docker.io/cingulara/openrmf-api-scoring:1.14.02
    container_name: openrmf-scoring-api
    restart: on-failure:5
    ports:
      - "8090"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8090
      - DBCONNECTION=mongodb://openrmfscore:openrmf1234!@scoredb/openrmfscore?authSource=openrmfscore
      - DBTYPE=mongo
      - DB=openrmfscore
      - LOGLEVEL=3
    depends_on:
      - scoredb
    networks:
      - openrmf
  
  openrmfapi-template:
    image: docker.io/cingulara/openrmf-api-template:1.14.04
    container_name: openrmf-template-api
    restart: on-failure:5
    ports:
      - "8088"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8088
      - NATSSERVERURL=nats://natsserver:4222
      - DBCONNECTION=mongodb://openrmftemplate:openrmf1234!@templatedb/openrmftemplate?authSource=openrmftemplate
      - DB=openrmftemplate
      - DBTYPE=mongo
      - LOGLEVEL=3
    depends_on:
      - templatedb
    networks:
      - openrmf

  openrmfapi-read:
    image: docker.io/cingulara/openrmf-api-read:1.14.02
    container_name: openrmf-read-api
    restart: on-failure:5
    ports:
      - "8084"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8084
      - NATSSERVERURL=nats://natsserver:4222
      - DBCONNECTION=mongodb://openrmf:openrmf1234!@checklistdb/openrmf?authSource=openrmf
      - DB=openrmf
      - DBTYPE=mongo
      - SCANHISTORYAPIURL=http://openrmfapi-scanhistory:8100
      - LOGLEVEL=3
    depends_on:
      - checklistdb
      - openrmfapi-scanhistory
    networks:
      - openrmf

  openrmfapi-scanhistory:
    image: eroman53/openrmf-api-scanhistory:latest
    container_name: openrmf-scanhistory-api
    restart: on-failure:5
    ports:
      - "8100"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8100
      - DBCONNECTION=mongodb://openrmfscanhistory:openrmf1234!@scanhistorydb/openrmfscanhistory?authSource=openrmfscanhistory
      - DB=openrmfscanhistory
      - DBTYPE=mongo
      - LOGLEVEL=3
    depends_on:
      - scanhistorydb
    networks:
      - openrmf

  openrmfapi-poam:
    image: eroman53/openrmf-api-poam:latest
    container_name: openrmf-poam-api
    restart: on-failure:5
    ports:
      - "8102"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8102
      - NATSSERVERURL=nats://natsserver:4222
      - DBCONNECTION=mongodb://openrmfpoam:openrmf1234!@poamdb/openrmfpoam?authSource=openrmfpoam
      - DB=openrmfpoam
      - DBTYPE=mongo
      - LOGLEVEL=3
    depends_on:
      - poamdb
      - natsserver
    networks:
      - openrmf

  openrmfapi-journal:
    image: eroman53/openrmf-api-journal:latest
    container_name: openrmf-journal-api
    restart: on-failure:5
    ports:
      - "8104"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8104
      - DBCONNECTION=mongodb://openrmfjournal:openrmf1234!@journaldb/openrmfjournal?authSource=openrmfjournal
      - DB=openrmfjournal
      - DBTYPE=mongo
      - LOGLEVEL=3
    depends_on:
      - journaldb
    networks:
      - openrmf

  openrmfapi-controls:
    image: docker.io/cingulara/openrmf-api-controls:1.14.02
    container_name: openrmf-controls-api
    restart: on-failure:5
    ports:
      - "8094"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8094
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    networks:
      - openrmf

  openrmfapi-audit:
    image: docker.io/cingulara/openrmf-api-audit:1.14.02
    container_name: openrmf-audit-api
    restart: on-failure:5
    ports:
      - "8096"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8096
      - DBCONNECTION=mongodb://openrmfaudit:openrmf1234!@auditdb/openrmfaudit?authSource=openrmfaudit
      - DB=openrmfaudit
      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - auditdb
    networks:
      - openrmf

  openrmfapi-report:
    image: docker.io/cingulara/openrmf-api-report:1.14.02
    container_name: openrmf-report-api
    restart: on-failure:5
    ports:
      - "8098"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8098
      - DBCONNECTION=mongodb://openrmfreport:openrmf1234!@reportdb/openrmfreport?authSource=openrmfreport
      - DB=openrmfreport
      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - reportdb
    networks:
      - openrmf

### 7 Messaging Containers
  openrmfmsg-score:
    image: docker.io/cingulara/openrmf-msg-score:1.14.01
    container_name: openrmf-score-nats-message-client
    restart: on-failure:5
    environment:
