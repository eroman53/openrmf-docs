      - MONGO_INITDB_ROOT_PASSWORD=myp2ssw0rd
      - MONGO_INITDB_DATABASE=openrmfscanhistory
    volumes:
      - scanhistory-data-volume:/data/db
      - ./initializeScanHistory.js:/docker-entrypoint-initdb.d/initialize.js:Z
    networks:
