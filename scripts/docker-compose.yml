version : '3.8'
 
services:
### 1 Web Front End Container
  openrmf-web:
    image: docker.io/cingulara/openrmf-web:1.14.01
    # image: cingulara/openrmf-web:1.14.01-privileged # this is to eventually make HTTPS 443 in a non-privileged manner
    container_name: openrmf-web
    restart: on-failure:5
    ports:
      - 8080:8080
      # - 8443:8443
    depends_on:
      - openrmfapi-scoring
      - openrmfapi-template
      - openrmfapi-read
      - openrmfapi-controls
      - openrmfapi-audit
      - openrmfapi-report
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:Z
      # - ./ssl/:/etc/ssl/:Z
    networks:
      - openrmf

### 6 API Containers
  openrmfapi-scoring:
    image: docker.io/cingulara/openrmf-api-scoring:1.14.02
    container_name: openrmf-scoring-api
    restart: on-failure:5
    ports:
      - "8090"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8090
      - DBCONNECTION=mongodb://openrmfscore:openrmf1234!@mongodb/openrmfscore?authSource=openrmfscore
      - DBTYPE=mongo
      - DB=openrmfscore
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf
  
  openrmfapi-template:
    image: docker.io/cingulara/openrmf-api-template:1.14.04
    container_name: openrmf-template-api
    restart: on-failure:5
    ports:
      - "8088"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8088
      - NATSSERVERURL=nats://natsserver:4222
      - DBCONNECTION=mongodb://openrmftemplate:openrmf1234!@mongodb/openrmftemplate?authSource=openrmftemplate
      - DB=openrmftemplate
      - DBTYPE=mongo
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-read:
    image: docker.io/cingulara/openrmf-api-read:1.14.02
    container_name: openrmf-read-api
    restart: on-failure:5
    ports:
      - "8084"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8084
      - NATSSERVERURL=nats://natsserver:4222
      - DBCONNECTION=mongodb://openrmf:openrmf1234!@mongodb/openrmf?authSource=openrmf
      - DB=openrmf
      - DBTYPE=mongo
      - SCANHISTORYAPIURL=http://openrmfapi-scanhistory:8100
      # report DB (read-only): vulnerability full-text search
      - REPORTDBCONNECTION=mongodb://openrmfreport:openrmf1234!@mongodb/openrmfreport?authSource=openrmfreport
      - REPORTDB=openrmfreport
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - openrmfapi-scanhistory
    networks:
      - openrmf

  openrmfapi-scanhistory:
    image: eroman53/openrmf-api-scanhistory:latest
    container_name: openrmf-scanhistory-api
    restart: on-failure:5
    ports:
      - "8100"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8100
      - DBCONNECTION=mongodb://openrmfscanhistory:openrmf1234!@mongodb/openrmfscanhistory?authSource=openrmfscanhistory
      - DB=openrmfscanhistory
      - DBTYPE=mongo
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-poam:
    image: eroman53/openrmf-api-poam:latest
    container_name: openrmf-poam-api
    restart: on-failure:5
    ports:
      - "8102"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8102
      - NATSSERVERURL=nats://natsserver:4222
      - DBCONNECTION=mongodb://openrmfpoam:openrmf1234!@mongodb/openrmfpoam?authSource=openrmfpoam
      - DB=openrmfpoam
      - DBTYPE=mongo
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

  openrmfapi-journal:
    image: eroman53/openrmf-api-journal:latest
    container_name: openrmf-journal-api
    restart: on-failure:5
    ports:
      - "8104"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8104
      - DBCONNECTION=mongodb://openrmfjournal:openrmf1234!@mongodb/openrmfjournal?authSource=openrmfjournal
      - DB=openrmfjournal
      - DBTYPE=mongo
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-controls:
    image: docker.io/cingulara/openrmf-api-controls:1.14.02
    container_name: openrmf-controls-api
    restart: on-failure:5
    ports:
      - "8094"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8094
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    networks:
      - openrmf

  openrmfapi-audit:
    image: docker.io/cingulara/openrmf-api-audit:1.14.02
    container_name: openrmf-audit-api
    restart: on-failure:5
    ports:
      - "8096"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8096
      - DBCONNECTION=mongodb://openrmfaudit:openrmf1234!@mongodb/openrmfaudit?authSource=openrmfaudit
      - DB=openrmfaudit
      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-report:
    image: docker.io/cingulara/openrmf-api-report:1.14.02
    container_name: openrmf-report-api
    restart: on-failure:5
    ports:
      - "8098"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8098
      - DBCONNECTION=mongodb://openrmfreport:openrmf1234!@mongodb/openrmfreport?authSource=openrmfreport
      - DB=openrmfreport
      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

### 7 Messaging Containers
  openrmfmsg-score:
    image: docker.io/cingulara/openrmf-msg-score:1.14.01
    container_name: openrmf-score-nats-message-client
    restart: on-failure:5
    environment:
      - DBCONNECTION=mongodb://openrmfscore:openrmf1234!@mongodb/openrmfscore?authSource=openrmfscore
      - DBTYPE=mongo
      - DB=openrmfscore
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

  openrmfmsg-compliance:
    image: docker.io/cingulara/openrmf-msg-compliance:1.14.01
    container_name: openrmf-compliance-nats-message-client
    restart: on-failure:5
    environment:
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - natsserver
    networks:
      - openrmf

  openrmfmsg-controls:
    image: docker.io/cingulara/openrmf-msg-controls:1.14.01
    container_name: openrmf-controls-nats-message-client
    restart: on-failure:5
    environment:
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - natsserver
    networks:
      - openrmf

  openrmfmsg-template:
    image: docker.io/cingulara/openrmf-msg-template:1.14.01
    container_name: openrmf-template-nats-message-client
    restart: on-failure:5
    environment:
      - DBCONNECTION=mongodb://openrmftemplate:openrmf1234!@mongodb/openrmftemplate?authSource=openrmftemplate
      - DB=openrmftemplate
      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

  openrmfmsg-system:
    image: docker.io/cingulara/openrmf-msg-system:1.14.01
    container_name: openrmf-system-nats-message-client
    restart: on-failure:5
    environment:
      - DBCONNECTION=mongodb://openrmf:openrmf1234!@mongodb/openrmf?authSource=openrmf
      - DB=openrmf
      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

  openrmfmsg-audit:
    image: docker.io/cingulara/openrmf-msg-audit:1.14.01
    container_name: openrmf-audit-nats-message-client
    restart: on-failure:5
    environment:
      - DBCONNECTION=mongodb://openrmfaudit:openrmf1234!@mongodb/openrmfaudit?authSource=openrmfaudit
      - DB=openrmfaudit
      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

  openrmfmsg-reports:
    image: docker.io/cingulara/openrmf-msg-reports:1.14.01
    container_name: openrmf-report-nats-message-client
    restart: on-failure:5
    environment:
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - SYSTEMDBTYPE=mongo
      - REPORTDBCONNECTION=mongodb://openrmfreport:openrmf1234!@mongodb/openrmfreport?authSource=openrmfreport
      - REPORTDB=openrmfreport
      - REPORTDBTYPE=mongo
      - SCANHISTORYDBCONNECTION=mongodb://openrmfscanhistory:openrmf1234!@mongodb/openrmfscanhistory?authSource=openrmfscanhistory
      - SCANHISTORYDB=openrmfscanhistory
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

  openrmfmsg-poam:
    image: eroman53/openrmf-msg-poam:latest
    container_name: openrmf-poam-nats-message-client
    restart: on-failure:5
    environment:
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - POAMDBCONNECTION=mongodb://openrmfpoam:openrmf1234!@mongodb/openrmfpoam?authSource=openrmfpoam
      - POAMDB=openrmfpoam
      - SCANHISTORYDBCONNECTION=mongodb://openrmfscanhistory:openrmf1234!@mongodb/openrmfscanhistory?authSource=openrmfscanhistory
      - SCANHISTORYDB=openrmfscanhistory
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

  openrmfsvc-trivy:
    image: eroman53/openrmf-svc-trivy:latest
    container_name: openrmf-trivy-scanner
    restart: on-failure:5
    ports:
      - "8114"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8114
      - DBCONNECTION=mongodb://openrmftrivyscan:openrmf1234!@mongodb/openrmftrivyscan?authSource=openrmftrivyscan
      - DB=openrmftrivyscan
      - SCANHISTORYAPIURL=http://openrmfapi-scanhistory:8100
      - KEYCLOAKTOKENURL=http://openrmf-keycloak:8080/auth/realms/openrmf/protocol/openid-connect/token
      - CLIENTID=openrmf-scanwatch
      - CLIENTSECRET=${SCANWATCH_CLIENTSECRET}
      - LOGLEVEL=2
    volumes:
      # the folder tree Trivy scans. TRIVYSCAN_TARGET picks the source:
      #   - a host path for local content, or
      #   - "trivyscan-nfs" to use the NFS export defined below
      #     (set TRIVYSCAN_NFS_SERVER + TRIVYSCAN_NFS_PATH in .env)
      # the UI's folder picker traverses whatever is mounted here
      - ${TRIVYSCAN_TARGET:-trivyscan-target-volume}:/target:ro
      # persists the ~60MB Trivy vulnerability DB across container recreation
      - trivyscan-cache-volume:/app/.trivycache
    depends_on:
      - mongodb
      - openrmfapi-scanhistory
    networks:
      - openrmf

  openrmfsvc-notify:
    image: eroman53/openrmf-svc-notify:latest
    container_name: openrmf-notify
    restart: on-failure:5
    ports:
      - "8116"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8116
      - DBCONNECTION=mongodb://openrmfnotify:openrmf1234!@mongodb/openrmfnotify?authSource=openrmfnotify
      - DB=openrmfnotify
      - DBTYPE=mongo
      - NATSSERVERURL=nats://natsserver:4222
      # checklist DB: resolve artifact->system + read package RBAC grants
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      # ConMon posture for the weekly digest (service-account call bypasses RBAC)
      - CONMONAPIURL=http://openrmfapi-conmon:8108
      - KEYCLOAKTOKENURL=http://openrmf-keycloak:8080/auth/realms/openrmf/protocol/openid-connect/token
      - CLIENTID=openrmf-scanwatch
      - CLIENTSECRET=${SCANWATCH_CLIENTSECRET}
      - LOGLEVEL=2
    depends_on:
      - mongodb
      - natsserver
      - openrmfapi-conmon
    networks:
      - openrmf

  openrmfapi-tasks:
    image: eroman53/openrmf-api-tasks:latest
    container_name: openrmf-tasks-api
    restart: on-failure:5
    ports:
      - "8112"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8112
      - DBCONNECTION=mongodb://openrmftasks:openrmf1234!@mongodb/openrmftasks?authSource=openrmftasks
      - DB=openrmftasks
      - DBTYPE=mongo
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-ppsm:
    image: eroman53/openrmf-api-ppsm:latest
    container_name: openrmf-ppsm-api
    restart: on-failure:5
    ports:
      - "8114"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8114
      - DBCONNECTION=mongodb://openrmfppsm:openrmf1234!@mongodb/openrmfppsm?authSource=openrmfppsm
      - DB=openrmfppsm
      - DBTYPE=mongo
      # read-only cross-service view of scan-observed open ports for reconciliation
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - SCANHISTORYDBCONNECTION=mongodb://openrmfscanhistory:openrmf1234!@mongodb/openrmfscanhistory?authSource=openrmfscanhistory
      - SCANHISTORYDB=openrmfscanhistory
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-inventory:
    image: eroman53/openrmf-api-inventory:latest
    container_name: openrmf-inventory-api
    restart: on-failure:5
    ports:
      - "8110"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8110
      - DBCONNECTION=mongodb://openrmfinventory:openrmf1234!@mongodb/openrmfinventory?authSource=openrmfinventory
      - DB=openrmfinventory
      - DBTYPE=mongo
      # read-only cross-service views for reconciliation and fleet findings
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - SCANHISTORYDBCONNECTION=mongodb://openrmfscanhistory:openrmf1234!@mongodb/openrmfscanhistory?authSource=openrmfscanhistory
      - SCANHISTORYDB=openrmfscanhistory
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfapi-conmon:
    image: eroman53/openrmf-api-conmon:latest
    container_name: openrmf-conmon-api
    restart: on-failure:5
    ports:
      - "8108"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8108
      - DBCONNECTION=mongodb://openrmfconmon:openrmf1234!@mongodb/openrmfconmon?authSource=openrmfconmon
      - DB=openrmfconmon
      - DBTYPE=mongo
      # read-only cross-service views for posture computation
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - SCANHISTORYDBCONNECTION=mongodb://openrmfscanhistory:openrmf1234!@mongodb/openrmfscanhistory?authSource=openrmfscanhistory
      - SCANHISTORYDB=openrmfscanhistory
      - POAMDBCONNECTION=mongodb://openrmfpoam:openrmf1234!@mongodb/openrmfpoam?authSource=openrmfpoam
      - POAMDB=openrmfpoam
      - TEMPLATEDBCONNECTION=mongodb://openrmftemplate:openrmf1234!@mongodb/openrmftemplate?authSource=openrmftemplate
      - TEMPLATEDB=openrmftemplate
      # asset registry: canonical host identity for coverage reconciliation
      # (optional -- coverage degrades to raw hostname matching if unset)
      - INVENTORYDBCONNECTION=mongodb://openrmfinventory:openrmf1234!@mongodb/openrmfinventory?authSource=openrmfinventory
      - INVENTORYDB=openrmfinventory
      - LOGLEVEL=3
    depends_on:
      - mongodb
    networks:
      - openrmf

  openrmfsvc-scanwatch:
    image: eroman53/openrmf-svc-scanwatch:latest
    container_name: openrmf-scanwatch
    restart: on-failure:5
    ports:
      - "8106"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8106
      # the SMB share location and read-only credentials are configured in the
      # web UI (Admin > Scan Watch), stored in this service's own DB -- not here
      - OPENRMFAPIURL=http://openrmfapi-read:8084
      - KEYCLOAKTOKENURL=http://openrmf-keycloak:8080/auth/realms/openrmf/protocol/openid-connect/token
      - CLIENTID=openrmf-scanwatch
      - CLIENTSECRET=${SCANWATCH_CLIENTSECRET}
      - DBCONNECTION=mongodb://openrmfscanwatch:openrmf1234!@mongodb/openrmfscanwatch?authSource=openrmfscanwatch
      - DB=openrmfscanwatch
      - LOGLEVEL=2
    depends_on:
      - mongodb
      - openrmfapi-read
    networks:
      - openrmf

  openrmfmsg-inventory:
    image: eroman53/openrmf-msg-inventory:latest
    container_name: openrmf-inventory-nats-message-client
    restart: on-failure:5
    environment:
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - INVENTORYDBCONNECTION=mongodb://openrmfinventory:openrmf1234!@mongodb/openrmfinventory?authSource=openrmfinventory
      - INVENTORYDB=openrmfinventory
      - SCANHISTORYDBCONNECTION=mongodb://openrmfscanhistory:openrmf1234!@mongodb/openrmfscanhistory?authSource=openrmfscanhistory
      - SCANHISTORYDB=openrmfscanhistory
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=2
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

  openrmfmsg-journal:
    image: eroman53/openrmf-msg-journal:latest
    container_name: openrmf-journal-nats-message-client
    restart: on-failure:5
    environment:
      - SYSTEMDBCONNECTION=mongodb://openrmf:openrmf1234!@mongodb/openrmf?authSource=openrmf
      - SYSTEMDB=openrmf
      - JOURNALDBCONNECTION=mongodb://openrmfjournal:openrmf1234!@mongodb/openrmfjournal?authSource=openrmfjournal
      - JOURNALDB=openrmfjournal
      - NATSSERVERURL=nats://natsserver:4222
      - LOGLEVEL=3
    depends_on:
      - mongodb
      - natsserver
    networks:
      - openrmf

### MongoDB (consolidated: one instance hosts every service database; the
### "one database per service, no shared writes" rule is preserved via
### per-database users -- see initializeAll.js)
  mongodb:
    image: docker.io/cingulara/mongo:7.0.32-jammy-nonroot
    container_name: mongodb
    restart: on-failure:5
    ports:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=myp2ssw0rd
      - MONGO_INITDB_DATABASE=openrmf
    volumes:
      - mongo-data-volume:/data/db
      - ./initializeAll.js:/docker-entrypoint-initdb.d/initialize.js:Z
    networks:
      - openrmf
### NATS messaging container (internal)
  natsserver: 
    image: docker.io/nats:2.12.8-alpine3.22
    container_name: nats
    command: -m 8222
    restart: on-failure:5
    ports:
      - "4222"
      - "6222"
      - "8222"
    networks:
      - openrmf

### Metrics
  natspromexporter: 
    image: docker.io/natsio/prometheus-nats-exporter:0.19.2
    container_name: nats-prometheus-exporter
    command: -varz -connz -subz http://natsserver:8222
    restart: on-failure:5
    ports:
      - "7777"
    networks:
      - openrmf

  nats-client-metrics: 
    image: docker.io/cingulara/nats-client-metrics:2.1.3
    container_name: nats-client-metrics
    restart: on-failure:5
    ports:
      - "7778"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:7778
      - NATSMETRICSURL=http://natsserver:8222
    networks:
      - openrmf

  nginx-metrics: 
    image: docker.io/nginx/nginx-prometheus-exporter:1.5.1
    container_name: nginx-metrics
    restart: on-failure:1000
    command:
      - -nginx.scrape-uri
      - http://openrmf-web:8080/status
      # - https://openrmf-web:8443/status
    ports:
      - "9113"
    # environment:
    #   - SSL_VERIFY=false # do not verify on any SSL self signed cert for the web UI
    networks:
      - openrmf

  prometheus:
    image: docker.io/prom/prometheus:v3.10.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    restart: on-failure:5
