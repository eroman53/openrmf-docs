# STOOGE login theme -- a thin brand layer over the inherited openrmf theme.
# Nothing here copies a FreeMarker template, so upstream Keycloak template
# changes keep flowing through the parent.
parent=openrmf
import=common/keycloak

# CACHE BUSTING -- read before editing any file under resources/.
# Keycloak serves theme assets with Cache-Control: max-age=2592000 (30 days)
# from a path whose version segment comes from the Keycloak build, NOT from our
# files. Edit a stylesheet and the URL is unchanged, so returning browsers keep
# the old copy for a month. The ?v= token below is the part we control:
# BUMP IT WHENEVER A FILE UNDER resources/ CHANGES, here and in the url()
# references inside stooge.css.
styles=css/login.css css/styles.css css/stooge.css?v=2

# darkMode lets the base template apply kcDarkModeClass from the OS setting;
# stooge-theme-toggle.js adds an explicit light/dark switch on top of it.
darkMode=true
scripts=js/stooge-theme-toggle.js?v=2
